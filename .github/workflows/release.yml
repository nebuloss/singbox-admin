name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The interface is built first: the server embeds it, so there is one
      # artifact per architecture and nothing to keep in step on the host.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Static, so the libc on the host is not a question — the same binary
      # runs on Alpine and on Debian. CGO off is what makes that true.
      - name: Build
        run: |
          mkdir -p out
          for target in amd64 arm64 armv7; do
            case $target in
              armv7) export GOARCH=arm GOARM=7 ;;
              *)     export GOARCH=$target; unset GOARM ;;
            esac
            CGO_ENABLED=0 GOOS=linux go build \
              -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "out/singbox-admin-linux-$target" ./src/server
          done
          cd out && sha256sum * > checksums.txt && cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/singbox-admin-linux-amd64
            out/singbox-admin-linux-arm64
            out/singbox-admin-linux-armv7
            out/checksums.txt
          generate_release_notes: true
